name: "MD3 Dashboard"
version: "0.0.5"
slug: "ha_dashboard_md3"
description: "A Material Design 3 dashboard for Home Assistant."
url: "https://github.com/mdegrootnl/svelte5-ha-dashboard-md3"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: stable
image: "ghcr.io/mdegrootnl/svelte5-ha-dashboard-md3"
homeassistant_api: true
hassio_role: default
ingress: true
ingress_port: 3000
ingress_stream: true
panel_icon: mdi:view-dashboard
panel_title: MD3 Dashboard
panel_admin: false
ports:
  3000/tcp: null
ports_description:
  3000/tcp: "Optional direct web interface port. Ingress is used by default."
webui: "http://[HOST]:[PORT:3000]"
watchdog: "http://[HOST]:[PORT:3000]/api/health"
environment:
  DASHBOARD_DEPLOYMENT: "ha-addon"
  DASHBOARD_DATA_DIR: "/data"
  DASHBOARD_REQUIRE_INGRESS: "true"
options: {}
schema: {}
map:
  - type: data
    read_only: false
