services:
  dashboard:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ${DASHBOARD_DATA_DIR:-./data}:/app/data
      - ./static:/app/static
    extra_hosts:
      - ${DASHBOARD_EXTRA_HOST:-host.docker.internal:host-gateway}
    restart: unless-stopped
    environment:
      - ORIGIN=${DASHBOARD_ORIGIN:-http://localhost:3000}
      - DASHBOARD_DATA_DIR=/app/data
      - DASHBOARD_HA_INTERNAL_URL=${DASHBOARD_HA_INTERNAL_URL:-}
