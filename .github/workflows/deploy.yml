name: Deploy to Home Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted
    env:
      DASHBOARD_DATA_DIR: /srv/ha-dashboard/data
      DASHBOARD_ORIGIN: ${{ vars.DASHBOARD_ORIGIN || 'http://192.168.0.113:3000' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Type Check
        run: npm run check

      - name: Test
        run: npm test -- --run

      - name: Install Playwright Browser
        run: npx playwright install chromium

      - name: Visual Smoke
        run: npm run test:visual
        env:
          PORT: 4173
          PLAYWRIGHT_PORT: 4173

      - name: Audit High Severity Dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Prepare Runtime Data Directory
        run: |
          mkdir -p "$DASHBOARD_DATA_DIR/uploads"

      - name: Build and Restart Container
        run: |
          docker compose up -d --build

      - name: Cleanup Old Images
        run: |
          docker system prune -f
