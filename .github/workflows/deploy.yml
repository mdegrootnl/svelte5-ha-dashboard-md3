name: Deploy to Home Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Restart Container
        run: |
          docker compose up -d --build

      - name: Cleanup Old Images
        run: |
          docker system prune -f
