name: Deploy to Home Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted
    env:
      DASHBOARD_DATA_DIR: /srv/ha-dashboard/data
      DASHBOARD_ORIGIN: ${{ vars.DASHBOARD_ORIGIN || 'http://192.168.0.113:3000' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run check

      - name: Test
        run: npm test -- --run

      - name: Audit High Severity Dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Prepare Runtime Data Directory
        run: |
          mkdir -p "$DASHBOARD_DATA_DIR/uploads"

      - name: Build and Restart Container
        run: |
          docker compose up -d --build

      - name: Cleanup Old Images
        run: |
          docker system prune -f
