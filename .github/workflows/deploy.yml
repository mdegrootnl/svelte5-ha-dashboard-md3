name: Validate Dashboard

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-dashboard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Type Check
        run: npm run check

      - name: Test
        run: npm test -- --run

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Visual Smoke
        run: npm run test:visual
        env:
          PORT: 4173
          PLAYWRIGHT_PORT: 4173

      - name: Audit High Severity Dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
      - name: Build controlled standalone image
        run: |
          IMAGE="dashboard:r01-${GITHUB_SHA}"
          docker build --build-arg BUILD_VERSION="r01-${GITHUB_SHA}" -t "$IMAGE" .
          mkdir release
          docker save "$IMAGE" | gzip > release/image.tar.gz
          printf '%s\n' "$IMAGE" > release/image.txt
          cd release
          sha256sum image.tar.gz > image.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: dashboard-deployment
          path: release
          retention-days: 14
